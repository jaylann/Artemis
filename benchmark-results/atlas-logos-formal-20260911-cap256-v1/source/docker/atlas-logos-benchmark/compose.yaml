name: atlas-thesis-logos-20260910

# Official Logos sources are pinned by stack.sh. Only isolation and local ports
# differ from its development compose; no provider or model loop is replaced.
services:
  logos-db:
    build:
      context: ../../build/atlas-logos-benchmark/edutelligence/logos/db
    restart: "no"
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=logosdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: logosdb
    volumes:
      - logos-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d logosdb"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: "no"
    command: [start-dev, --import-realm, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18095
    volumes:
      - ../../build/atlas-logos-benchmark/edutelligence/logos/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:18095:8080"]

  logos-webservice:
    build:
      context: ../../build/atlas-logos-benchmark/edutelligence/logos/logos-webservice
    restart: "no"
    depends_on:
      logos-db:
        condition: service_healthy
    environment:
      DB_HOST: logos-db
      DB_PORT: 5432
      DB_NAME: logosdb
      DB_USER: postgres
      DB_PASSWORD: root
      LOGOS_ORCHESTRATOR_URL: http://logos-orchestrator:8080
      LOGOS_INTERNAL_SECRET: ${LOGOS_INTERNAL_SECRET:?generated by stack setup}
      JDK_JAVA_OPTIONS: -XX:MaxRAMPercentage=60.0
      KEYCLOAK_ISSUER_URI: http://localhost:18095/realms/tum
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/tum/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: tum
      KEYCLOAK_CLIENT_ID: logos
      KEYCLOAK_ROLES_LOGOS_ADMIN: itg-admin
      KEYCLOAK_ROLES_APP_ADMIN: chair-member
      KEYCLOAK_AUTO_PROVISION_TEAMS: "false"
      KEYCLOAK_SYNC_ENABLED: "false"
      LOGOS_CORS_ALLOWED_ORIGINS: http://localhost:18092
    ports: ["127.0.0.1:18092:8081"]

  logos-orchestrator:
    build:
      context: ../../build/atlas-logos-benchmark/edutelligence
      dockerfile: logos/logos-orchestrator/Dockerfile
    restart: "no"
    depends_on:
      logos-db:
        condition: service_healthy
    environment:
      LOGOS_DOMAIN: localhost
      LOGOS_INTERNAL_SECRET: ${LOGOS_INTERNAL_SECRET:?generated by stack setup}
      LOGOS_CAPACITY_PLANNER_ENABLED: "false"
      LOGOS_CALIB_ENABLED: "false"
      LOGOS_DB_URL: postgresql://postgres:root@logos-db:5432/logosdb
    volumes:
      - logos-runtime:/src/logos
    ports: ["127.0.0.1:18090:8080"]

  artemis-db:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_USER: Artemis
      POSTGRES_PASSWORD: atlas-local-only
      POSTGRES_DB: Artemis
    ports: ["127.0.0.1:5439:5432"]
    volumes:
      - artemis-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U Artemis -d Artemis"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  logos-data:
  logos-runtime:
  artemis-data:
