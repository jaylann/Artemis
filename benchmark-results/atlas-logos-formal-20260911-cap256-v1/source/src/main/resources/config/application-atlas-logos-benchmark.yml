# Isolated local evaluation. Real Spring AI transport/retries and Atlas tools remain in use.
logging:
    level:
        ROOT: INFO
        de.tum.cit.aet.artemis: INFO
        org.springframework.ai: WARN
        com.openai: WARN

server:
    address: 127.0.0.1
    port: 8083
    url: http://localhost:8083

eureka:
    client:
        enabled: false
        register-with-eureka: false
        fetch-registry: false

spring:
    datasource:
        url: jdbc:postgresql://127.0.0.1:5439/Artemis
        username: Artemis
        password: atlas-local-only
        driver-class-name: org.postgresql.Driver
    hazelcast:
        port: 5793
        localInstances: false
    ai:
        model:
            chat: openai
        openai:
            base-url: ${LOGOS_BASE_URL:http://127.0.0.1:18090/v1}
            api-key: ${LOGOS_API_KEY}
            microsoft-foundry: false
            # Explicit for both Chat and Responses; the SDK records each retry separately.
            timeout: 5m
            max-retries: 3
            chat:
                model: gpt-5.6-luna
                temperature: 1.0

artemis:
    user-management:
        use-external: false
    version-control:
        url: http://localhost:8083
        ssh-template-clone-url: ssh://git@localhost:7933/
        ssh-port: 7933
    atlas:
        enabled: true
        atlasml:
            enabled: false
        flavor-strip-model: gpt-5.6-luna
        flavor-strip-reasoning-effort: medium
        flavor-strip-temperature: 1.0
        orchestrator:
            responses-api-enabled: true
            model: gpt-5.6-luna
            reasoning-effort: xhigh
            worker-model: gpt-5.6-luna
            worker-reasoning-effort: high
            # Only local waiting is shortened; execution latency excludes this delay.
            debounce-window-seconds: 5
            scheduler-rate-ms: 1000
    hyperion:
        enabled: false
    iris:
        enabled: false
    deimos:
        enabled: false
