name: artemis-atlas-demo
services:
    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_DB: atlas_demo
            POSTGRES_USER: atlas_demo
            POSTGRES_PASSWORD: atlas_demo_local
        ports:
            - '127.0.0.1:${DEMO_DB_PORT:-55432}:5432'
        volumes:
            - data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U atlas_demo -d atlas_demo']
            interval: 2s
            timeout: 3s
            retries: 60
volumes:
    data:
